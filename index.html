<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="vardavarr.github.io — Grid Notation App and Hatch Notation App." />
    <link rel="icon" href="data:," />
    <title>vardavarr.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Permanent dark theme — no light scheme. */
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --ink: #f4f4f1;
        --muted: #9b9b96;
        --faint: #3d3d3a;
        --tick: #2c2c2a;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      ::selection {
        background: var(--ink);
        color: var(--bg);
      }

      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem 5rem;
        animation: settle 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* A single faint row of tallies — the only ornament on the page. */
      .ticks {
        display: flex;
        gap: 7px;
        margin-bottom: clamp(1.75rem, 4vh, 2.75rem);
      }

      .ticks span {
        display: block;
        width: 2px;
        height: 18px;
        border-radius: 1px;
        background: var(--tick);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 10vw, 6.25rem);
        font-weight: 550;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      h1 .domain {
        color: var(--faint);
        font-weight: 450;
      }

      .apps {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin: clamp(2rem, 5vh, 3rem) 0 0;
      }

      .apps a {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        border: 1px solid var(--faint);
        border-radius: 999px;
        color: var(--ink);
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1;
        text-decoration: none;
        transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
      }

      .apps a:hover {
        border-color: var(--ink);
      }

      .apps a:focus-visible {
        border-color: var(--ink);
        outline: 1.5px solid var(--ink);
        outline-offset: 3px;
      }

      footer {
        position: fixed;
        inset-inline: 0;
        bottom: max(1.75rem, env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        animation: settle 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      footer a {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-decoration: none;
        padding: 0.5rem 0.75rem;
        transition: color 0.25s ease;
      }

      footer a:hover { color: var(--ink); }

      footer a:focus-visible {
        color: var(--ink);
        outline: 1.5px solid var(--ink);
        outline-offset: 3px;
        border-radius: 2px;
      }

      @keyframes settle {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main, footer, .apps a { animation: none; }
        footer a, .apps a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ticks" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>vardavarr<span class="domain">.github.io</span></h1>
      <nav class="apps" aria-label="Apps">
        <a href="/gridalpha/">Grid Notation App</a>
        <a href="/hatchalpha/">Hatch Notation App</a>
      </nav>
    </main>
    <footer>
      <a href="https://github.com/vardavarr" target="_blank" rel="noopener">github</a>
    </footer>
  </body>
</html>
