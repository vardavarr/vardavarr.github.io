<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Drum Rhythm Grid — a one-screen rhythm table for drum set. Paint hits on a beat grid, switch subdivisions without moving your hits, and play the pattern back with a General MIDI drum kit." />
    <link rel="icon" href="data:," />
    <title>Drum Rhythm Grid — Standalone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3efe8;
        --surface: #fffdf8;
        --surface2: #ece7dc;
        --text: #1c1917;
        --dim: #78716c;
        --border: #d6cfc2;
        --accent: #d97706;
        --accent-strong: #b45309;
        --teal: #0f766e;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141210;
          --surface: #1e1b18;
          --surface2: #29241f;
          --text: #ece7df;
          --dim: #a8a29e;
          --border: #3a332c;
          --accent: #f59e0b;
          --accent-strong: #fbbf24;
          --teal: #2dd4bf;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Archivo", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      button { font-family: inherit; color: inherit; cursor: pointer; }
      button:disabled { cursor: default; }
      input { font-family: inherit; color: inherit; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

      /* ── Shell: pre-rotated on portrait phones, upright elsewhere ── */
      #shell { position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
      #shell.rotated { left: 100dvw; width: 100dvh; height: 100dvw; transform: rotate(90deg); transform-origin: top left; }

      .stage { display: flex; flex-direction: column; height: 100%; padding: 8px 10px 10px; }

      /* ── Title row ── */
      .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
      #patternName {
        flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
        font-size: 22px; font-weight: 800; letter-spacing: -0.02em; padding: 0;
      }
      #patternName::placeholder { color: var(--dim); }
      #saveState { flex-shrink: 0; padding-bottom: 3px; font-size: 12px; font-weight: 500; color: var(--dim); white-space: nowrap; }

      /* ── Fill palette ── */
      .palette { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .palette-label { flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
      .palette-tools { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .tool-btn {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        border: 1px solid var(--border); background: var(--surface);
        border-radius: var(--radius); padding: 6px 4px;
      }
      .tool-btn[aria-pressed="true"] { border-color: var(--teal); background: var(--surface2); box-shadow: 0 0 0 2px var(--teal); }
      .tool-preview { display: block; width: 44px; max-width: 100%; height: 22px; border-radius: 4px; border: 1px solid var(--border); }
      .tool-name { font-size: 11px; font-weight: 600; line-height: 1; }

      /* ── Grid ── */
      .grid-wrap {
        position: relative; flex: 1; min-height: 0; margin-top: 8px;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 6px;
      }
      .grid { display: grid; height: 100%; width: 100%; gap: 3px; }
      .playhead-cell { display: flex; align-items: flex-start; justify-content: center; }
      .playhead-tri { display: block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--teal); }
      .corner {
        display: flex; align-items: center; overflow: hidden; border-radius: 4px;
        background: var(--surface2); padding: 0 6px;
        font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
      }
      .col-head { position: relative; display: flex; align-items: center; overflow: hidden; border-radius: 4px; background: var(--surface); }
      .col-head.beat { background: var(--surface2); }
      .col-head.playing { background: var(--teal); color: #fff; }
      .col-head input {
        width: 100%; background: transparent; border: 0; outline: none; text-align: center;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500; color: var(--dim); padding: 0 2px;
      }
      .col-head.beat input { font-size: 15px; font-weight: 700; color: inherit; }
      .col-head.dense input { font-size: 11px; }
      .col-head.denser input { font-size: 9px; }
      .col-remove {
        position: absolute; right: 0; top: 0; width: 14px; height: 14px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border: 0; border-radius: 999px; background: transparent; font-size: 9px; line-height: 1; color: var(--dim);
      }
      .row-label { display: flex; align-items: center; gap: 2px; min-height: 0; overflow: hidden; border-radius: 4px; background: var(--surface); padding: 0 4px; }
      .row-label input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 13px; font-weight: 600; padding: 0; }
      .row-remove {
        flex-shrink: 0; width: 20px; height: 20px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--border); border-radius: 999px; background: transparent; font-size: 12px; line-height: 1; color: var(--dim);
      }
      .row-remove:disabled { opacity: 0.3; }
      .cell-wrap { min-height: 0; border-radius: 4px; padding: 2px; }
      .cell-wrap.beat { background: color-mix(in srgb, var(--surface2) 60%, transparent); }
      .cell-wrap.playing { background: color-mix(in srgb, var(--teal) 25%, transparent); }
      .cell {
        display: block; width: 100%; height: 100%; min-height: 0; padding: 0;
        border: 1px solid var(--border); border-radius: 4px; touch-action: none;
      }
      .cell:active { transform: scale(0.95); }

      /* Cell fills */
      .cell-solid { background: var(--accent); border-color: var(--accent-strong); }
      .cell-lined {
        background-color: var(--surface);
        background-image: repeating-linear-gradient(45deg, var(--accent) 0, var(--accent) 2px, transparent 2px, transparent 7px);
        border-color: var(--accent);
      }
      .cell-dotted {
        background-color: var(--surface);
        background-image: radial-gradient(circle, var(--accent) 1.8px, transparent 1.9px);
        background-size: 8px 8px; border-color: var(--accent);
      }
      .cell-crosshatch {
        background-color: var(--surface);
        background-image:
          repeating-linear-gradient(45deg, var(--accent) 0, var(--accent) 2px, transparent 2px, transparent 7px),
          repeating-linear-gradient(-45deg, var(--accent) 0, var(--accent) 2px, transparent 2px, transparent 7px);
        border-color: var(--accent);
      }
      .cell-rings {
        background-color: var(--surface);
        background-image: radial-gradient(circle, transparent 2.6px, var(--accent) 2.8px, var(--accent) 4.4px, transparent 4.6px);
        background-size: 11px 11px; border-color: var(--accent);
      }
      .cell-empty { background: var(--surface); }

      /* ── Control strip ── */
      .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; flex-shrink: 0; }
      .strip-group { display: flex; align-items: center; gap: 6px; }
      .strip-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
      .round-btn {
        width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface2); font-size: 16px; font-weight: 700; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .round-btn:disabled { opacity: 0.4; }
      .tempo-val { width: 60px; text-align: center; font-size: 14px; font-weight: 700; }
      .beats-val { width: 20px; text-align: center; font-size: 16px; font-weight: 700; }
      .play-btn { border: 0; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; color: #fff; background: var(--teal); }
      .play-btn.playing { background: var(--accent-strong); }
      .seg { display: flex; overflow: hidden; border: 1px solid var(--border); border-radius: 999px; }
      .seg button { border: 0; background: var(--surface2); color: var(--text); padding: 7px 10px; font-size: 12px; font-weight: 600; font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }
      .pill-btn { border: 1px solid var(--border); border-radius: 999px; background: var(--surface); padding: 7px 12px; font-size: 12px; font-weight: 700; }
      .pill-btn:disabled { opacity: 0.4; }
      .pill-btn.primary { border: 0; background: var(--accent); color: #fff; }
      .pill-btn.dim { color: var(--dim); }
      #aboutBtn { margin-left: auto; flex-shrink: 0; }

      /* ── About popup ── */
      .modal-backdrop {
        position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.5); padding: 16px;
      }
      .modal {
        width: 100%; max-width: 512px; max-height: 100%; overflow-y: auto;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 16px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      }
      .modal h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
      .modal p { margin: 12px 0 0; font-size: 14px; line-height: 1.55; color: var(--dim); }
      .modal p.small { font-size: 12px; }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .modal-close {
        flex-shrink: 0; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface2); font-size: 16px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .modal-actions .pill-btn { flex: 1; white-space: nowrap; text-align: center; }
      .done-btn { width: 100%; margin-top: 10px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 9px 16px; font-size: 14px; font-weight: 700; }

      @media (max-width: 560px) {
        .palette-label { display: none; }
        #patternName { font-size: 19px; }
        .row-label input { font-size: 11px; }
        .tool-preview { height: 18px; }
      }
    </style>
  </head>
  <body>
    <noscript><p style="padding:16px">Drum Rhythm Grid needs JavaScript to run.</p></noscript>
    <div id="shell">
      <section class="stage" aria-label="Rhythm grid stage">
        <div class="title-row">
          <input id="patternName" aria-label="Pattern name" placeholder="Name this beat" maxlength="80" />
          <span id="saveState" aria-live="polite"></span>
        </div>

        <div class="palette" role="toolbar" aria-label="Fill tools">
          <span class="palette-label">Paint</span>
          <div class="palette-tools" id="paletteTools"></div>
        </div>

        <div class="grid-wrap">
          <div class="grid" id="grid" role="grid" aria-label="Rhythm grid"></div>
        </div>

        <div class="strip" aria-label="Playback, time signature, subdivisions, and grid actions">
          <div class="strip-group">
            <button type="button" id="playBtn" class="play-btn" aria-label="Play pattern">▶ Play</button>
            <span class="strip-label">Tempo</span>
            <button type="button" id="tempoDown" class="round-btn" aria-label="Tempo down">−</button>
            <span class="tempo-val mono" id="tempoVal"></span>
            <button type="button" id="tempoUp" class="round-btn" aria-label="Tempo up">+</button>
          </div>

          <div class="strip-group">
            <span class="strip-label">Beats</span>
            <button type="button" id="beatsDown" class="round-btn" aria-label="Remove one beat">−</button>
            <span class="beats-val mono" id="beatsVal"></span>
            <button type="button" id="beatsUp" class="round-btn" aria-label="Add one beat">+</button>
          </div>

          <div class="strip-group">
            <span class="strip-label">Divide each beat</span>
            <div class="seg" role="group" aria-label="Subdivision" id="subSeg"></div>
          </div>

          <div class="strip-group">
            <button type="button" id="addVoice" class="pill-btn primary">+ Add voice</button>
            <button type="button" id="addColumn" class="pill-btn">+ Add column</button>
            <button type="button" id="clearHits" class="pill-btn dim">Clear hits</button>
          </div>

          <button type="button" id="aboutBtn" class="pill-btn" aria-label="About this app">About</button>
        </div>
      </section>
    </div>

      /* ── Drum voice → General MIDI note (channel 10) ── */
      function gmNoteForRow(label) {
        var s = String(label || "").toLowerCase();
        function has() { for (var i = 0; i < arguments.length; i++) if (s.indexOf(arguments[i]) !== -1) return true; return false; }
        if (has("hat")) { if (has("open")) return 46; if (has("pedal", "foot")) return 44; return 42; }
        if (has("snare")) return has("electric", "electronic") ? 40 : 38;
        if (has("kick", "bass drum", "bassdrum")) return 36;
        if (has("floor")) return has("high") ? 43 : 41;
        if (has("clap")) return 39;
        if (has("rim", "side stick", "sidestick", "stick")) return 37;
        if (has("cowbell")) return 56;
        if (has("crash")) return has("2") ? 57 : 49;
        if (has("splash")) return 55;
        if (has("china", "chinese")) return 52;
        if (has("ride")) return has("bell") ? 53 : 51;
        if (has("bell")) return 53;
        if (has("tom")) { if (has("high", "hi")) return 50; if (has("low")) return 45; if (has("mid")) return 47; return 48; }
        if (has("bass")) return 36;
        if (has("drum")) return 38;
        return null;
      }
      function synthKindForRow(label) {
        var s = String(label || "").toLowerCase();
        if (/(tom|kick|bass|drum|conga|bongo|timpani)/.test(s)) return "low";
        if (/(hat|cymbal|crash|ride|splash|china|bell|metal|triangle)/.test(s)) return "metal";
        return "snap";
      }

      /* ── Columns / remapping ── */
      function defaultColumns(beats, subdivision) {
        var cols = [];
        for (var b = 1; b <= beats; b++) {
          if (subdivision === 1) cols.push(String(b));
          else if (subdivision === 2) cols.push(String(b), "&");
          else if (subdivision === 3) cols.push(String(b), "trip", "let");
          else cols.push(String(b), "e", "&", "a");
        }
        return cols;
      }
      function blankCells(rows, cols) {
        var out = [];
        for (var r = 0; r < rows; r++) { var row = []; for (var c = 0; c < cols; c++) row.push(0); out.push(row); }
        return out;
      }
      /* Hits keep their musical time (beat, offset-in-beat) across a
         subdivision change: new columns open up between the beats.
         An offset that doesn't exist in the new grid is dropped. */
      function remapSubdivision(oldColumns, oldCells, rowCount, beats, oldSub, newSub) {
        var columns = defaultColumns(beats, newSub);
        var cells = blankCells(rowCount, columns.length);
        oldColumns.forEach(function (label, c) {
          var beat = Math.floor(c / oldSub);
          if (beat >= beats) return;
          var offset = c % oldSub;
          if ((offset * newSub) % oldSub !== 0) return;
          var nc = beat * newSub + (offset * newSub) / oldSub;
          columns[nc] = label;
          for (var r = 0; r < rowCount; r++) cells[r][nc] = (oldCells[r] && oldCells[r][c]) || 0;
        });
        return { columns: columns, cells: cells };
      }
      function remapBeats(oldColumns, oldCells, rowCount, newBeats, subdivision) {
        var columns = defaultColumns(newBeats, subdivision);
        var cells = blankCells(rowCount, columns.length);
        oldColumns.forEach(function (label, c) {
          var beat = Math.floor(c / subdivision);
          if (beat >= newBeats) return;
          columns[c] = label;
          for (var r = 0; r < rowCount; r++) cells[r][c] = (oldCells[r] && oldCells[r][c]) || 0;
        });
        return { columns: columns, cells: cells };
      }

      /* ── State ── */
      function defaultPattern() {
        var beats = 4, subdivision = 2;
        var columns = defaultColumns(beats, subdivision);
        var rows = ["Hi-Hat", "Snare", "Bass Drum"];
        return { name: "My Beat", beats: beats, subdivision: subdivision, columns: columns, rows: rows, cells: blankCells(rows.length, columns.length) };

      function loadPattern() {

          var raw = localStorage.getItem(PATTERN_KEY);
          if (!raw) return defaultPattern();
          var p = JSON.parse(raw);
          if (!p || !Array.isArray(p.columns) || !Array.isArray(p.rows) || !Array.isArray(p.cells)) return defaultPattern();
          if (typeof p.name !== "string") p.name = "My Beat";
          if (!(p.beats >= 1 && p.beats <= 12)) p.beats = 4;
          if (!(p.subdivision >= 1 && p.subdivision <= 4)) p.subdivision = 2;
          return p;

        else { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(write, 400); }

        b.dataset.value = String(t.value);
        var prev = document.createElement("span");
        prev.className = "tool-preview cell-" + t.name;
        prev.setAttribute("aria-hidden", "true");
        var nm = document.createElement("span");
        nm.className = "tool-name";
        nm.textContent = t.label;
        b.appendChild(prev); b.appendChild(nm);
        b.addEventListener("click", function () { tool = t.value; renderPalette(); });
        paletteEl.appendChild(b);
      });
      function renderPalette() {
        Array.prototype.forEach.call(paletteEl.children, function (b) {
          b.setAttribute("aria-pressed", Number(b.dataset.value) === tool ? "true" : "false");
        });
      }

      /* ── Subdivision segmented control ── */
      var subSeg = document.getElementById("subSeg");
      [{ v: 1, label: "1" }, { v: 2, label: "&" }, { v: 3, label: "trip" }, { v: 4, label: "e & a" }].forEach(function (opt) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = opt.label;
        b.setAttribute("aria-label", "Subdivision " + opt.label);
        b.dataset.value = String(opt.v);
        b.addEventListener("click", function () { setSubdivision(opt.v); });
        subSeg.appendChild(b);
      });
      function renderSubSeg() {
        Array.prototype.forEach.call(subSeg.children, function (b) {
          b.setAttribute("aria-pressed", Number(b.dataset.value) === pattern.subdivision ? "true" : "false");
        });
      }

      /* ── Grid rendering ── */
      var playColumn = null;
      function hitCount() { var n = 0; pattern.cells.forEach(function (row) { row.forEach(function (v) { if (v !== 0) n++; }); }); return n; }
      function updateSaveState() {
        var n = hitCount();
        saveStateEl.textContent = n > 0 ? n + " hit" + (n === 1 ? "" : "s") + " · saved on this device" : "Saved on this device";
      }
      function render() {
        var colCount = pattern.columns.length;
        tempoValEl.textContent = tempo + " BPM";
        document.getElementById("tempoDown").disabled = tempo <= 40;
        document.getElementById("tempoUp").disabled = tempo >= 208;
        beatsValEl.textContent = String(pattern.beats);
        beatsValEl.setAttribute("aria-label", pattern.beats + " beats per measure");
        document.getElementById("beatsDown").disabled = pattern.beats <= 1;
        document.getElementById("beatsUp").disabled = pattern.beats >= 12;
        document.getElementById("addVoice").disabled = pattern.rows.length >= 12;
        document.getElementById("addColumn").disabled = colCount >= 48;
        document.getElementById("clearHits").disabled = hitCount() === 0;
        renderSubSeg();
        renderPalette();
        updateSaveState();

        gridEl.style.gridTemplateColumns = "minmax(64px, 104px) repeat(" + colCount + ", minmax(0, 1fr))";
        gridEl.style.gridTemplateRows = "0.85rem 1.9rem repeat(" + pattern.rows.length + ", minmax(0, 1fr))";
        gridEl.innerHTML = "";

        var headDensity = colCount > 24 ? "denser" : colCount > 12 ? "dense" : "";
        function isBeat(c) { return c % pattern.subdivision === 0; }

        /* Playhead row */
        gridEl.appendChild(document.createElement("div"));
        pattern.columns.forEach(function (_, c) {
          var d = document.createElement("div");
          d.className = "playhead-cell";
          d.setAttribute("aria-hidden", "true");
          if (playColumn === c) { var tri = document.createElement("span"); tri.className = "playhead-tri"; d.appendChild(tri); }
          gridEl.appendChild(d);
        });

        /* Header row */
        var corner = document.createElement("div");
        corner.className = "corner";
        corner.textContent = "Voice ↓ · Beat →";
        gridEl.appendChild(corner);
        pattern.columns.forEach(function (label, c) {
          var d = document.createElement("div");
          d.className = "col-head" + (isBeat(c) ? " beat" : "") + (playColumn === c ? " playing" : "") + (headDensity ? " " + headDensity : "");
          var inp = document.createElement("input");
          inp.value = label;
          inp.setAttribute("aria-label", "Column " + (c + 1) + " label");
          inp.maxLength = 12;
          inp.addEventListener("input", function () { pattern.columns[c] = inp.value; save(false); });
          var rm = document.createElement("button");
          rm.type = "button";
          rm.className = "col-remove";
          rm.textContent = "×";
          rm.setAttribute("aria-label", "Remove column " + (c + 1));
          rm.addEventListener("click", function () { removeColumn(c); });
          d.appendChild(inp); d.appendChild(rm);
          gridEl.appendChild(d);
        });

        /* Body rows */
        pattern.rows.forEach(function (rowLabel, r) {
          var lab = document.createElement("div");
          lab.className = "row-label";
          var inp = document.createElement("input");
          inp.value = rowLabel;
          inp.setAttribute("aria-label", "Row " + (r + 1) + " voice label");
          inp.maxLength = 30;
          inp.addEventListener("input", function () { pattern.rows[r] = inp.value; save(false); });
          var rm = document.createElement("button");
          rm.type = "button";
          rm.className = "row-remove";
          rm.textContent = "×";
          rm.setAttribute("aria-label", "Remove voice " + rowLabel);
          rm.disabled = pattern.rows.length <= 1;
          rm.addEventListener("click", function () { removeRow(r); });
          lab.appendChild(inp); lab.appendChild(rm);
          gridEl.appendChild(lab);

          pattern.columns.forEach(function (colLabel, c) {
            var value = (pattern.cells[r] && pattern.cells[r][c]) || 0;
            var wrap = document.createElement("div");
            wrap.className = "cell-wrap" + (playColumn === c ? " playing" : isBeat(c) ? " beat" : "");
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "cell cell-" + FILL_NAMES[value];
            var toolLabel = (FILL_TOOLS.filter(function (t) { return t.value === tool; })[0] || FILL_TOOLS[0]).label;
            btn.setAttribute("aria-label", rowLabel + ", " + colLabel + ": " + FILL_NAMES[value] + ". Tap to paint " + toolLabel + ", or tap again with " + toolLabel + " to erase.");
            btn.addEventListener("pointerdown", function (e) { e.preventDefault(); cellPointerDown(r, c); });
            btn.addEventListener("pointerenter", function () { cellPointerEnter(r, c); });
            btn.addEventListener("click", function () { cellClick(r, c); });
            wrap.appendChild(btn);
            gridEl.appendChild(wrap);
          });
        });
      }
      /* Light-weight playhead-only refresh (no full re-render). */
      function renderPlayhead() {
        var colCount = pattern.columns.length;
        var cells = gridEl.children;
        for (var c = 0; c < colCount; c++) {
          var ph = cells[1 + c];
          if (ph) {
            ph.innerHTML = "";
            if (playColumn === c) { var tri = document.createElement("span"); tri.className = "playhead-tri"; ph.appendChild(tri); }
          }
          var head = cells[1 + colCount + 1 + c];
          if (head) head.classList.toggle("playing", playColumn === c);
        }
        var rowStride = colCount + 1;
        var bodyStart = 1 + colCount + 1 + colCount;
        for (var r = 0; r < pattern.rows.length; r++) {
          for (var cc = 0; cc < colCount; cc++) {
            var w = cells[bodyStart + r * rowStride + 1 + cc];
            if (w) {
              w.classList.toggle("playing", playColumn === cc);
              if (playColumn !== cc) w.classList.toggle("beat", cc % pattern.subdivision === 0);
            }
          }
        }
      }

      /* ── Painting: same fill toggles off, different fill overwrites ── */
      var painting = false, strokeTarget = null, lastPaint = null;
      function applyCell(r, c, target) {
        if (!pattern.cells[r] || pattern.cells[r][c] === target) return;
        pattern.cells[r][c] = target;
        save(true);
        render();
      }
      function toggleCell(r, c) {
        var cur = (pattern.cells[r] && pattern.cells[r][c]) || 0;
        var target = cur === tool ? 0 : tool;
        applyCell(r, c, target);
        return target;
      }
      function cellPointerDown(r, c) {
        painting = true;
        strokeTarget = toggleCell(r, c);
        lastPaint = { key: r + "-" + c, time: Date.now() };
      }
      function cellPointerEnter(r, c) {
        if (!painting || strokeTarget === null) return;
        applyCell(r, c, strokeTarget);
      }
      function cellClick(r, c) {
        if (lastPaint && lastPaint.key === r + "-" + c && Date.now() - lastPaint.time < 1000) return;
        toggleCell(r, c);
      }
      window.addEventListener("pointerup", function () { painting = false; strokeTarget = null; });
      window.addEventListener("pointercancel", function () { painting = false; strokeTarget = null; });

      /* ── Structure edits ── */
      function setBeats(beats) {
        var clamped = Math.min(12, Math.max(1, beats));
        var res = remapBeats(pattern.columns, pattern.cells, pattern.rows.length, clamped, pattern.subdivision);
        pattern.beats = clamped; pattern.columns = res.columns; pattern.cells = res.cells;
        save(true); render();
      }
      function setSubdivision(sub) {
        if (sub === pattern.subdivision) return;
        var res = remapSubdivision(pattern.columns, pattern.cells, pattern.rows.length, pattern.beats, pattern.subdivision, sub);
        pattern.subdivision = sub; pattern.columns = res.columns; pattern.cells = res.cells;
        save(true); render();
      }
      function addRow() {
        if (pattern.rows.length >= 12) return;
        pattern.rows.push("New voice");
        pattern.cells.push(pattern.columns.map(function () { return 0; }));
        save(true); render();
      }
      function removeRow(i) {
        if (pattern.rows.length <= 1) return;
        pattern.rows.splice(i, 1); pattern.cells.splice(i, 1);
        save(true); render();
      }
      function addColumn() {
        if (pattern.columns.length >= 48) return;
        pattern.columns.push("·");
        pattern.cells.forEach(function (row) { row.push(0); });
        save(true); render();
      }
      function removeColumn(i) {
        if (pattern.columns.length <= 1) return;
        pattern.columns.splice(i, 1);
        pattern.cells.forEach(function (row) { row.splice(i, 1); });
        save(true); render();
      }
      document.getElementById("beatsDown").addEventListener("click", function () { setBeats(pattern.beats - 1); });
      document.getElementById("beatsUp").addEventListener("click", function () { setBeats(pattern.beats + 1); });
      document.getElementById("addVoice").addEventListener("click", addRow);
      document.getElementById("addColumn").addEventListener("click", addColumn);
      document.getElementById("clearHits").addEventListener("click", function () {
        pattern.cells = pattern.cells.map(function (row) { return row.map(function () { return 0; }); });
        save(true); render();
      });
      document.getElementById("tempoDown").addEventListener("click", function () { setTempo(tempo - 5); });
      document.getElementById("tempoUp").addEventListener("click", function () { setTempo(tempo + 5); });
      function setTempo(t) {
        tempo = Math.min(208, Math.max(40, t));
        try { localStorage.setItem(TEMPO_KEY, String(tempo)); } catch (e) {}
        render();
      }

      /* ── Playback ── */
      var audioCtx = null, buffers = null, noiseBuffer = null, master = null;
      var soundState = "idle";
      var isPlaying = false, playingFlag = false, runId = 0, playTimer = null, uiTimers = [];
      function ensureAudio() {
        if (audioCtx && buffers) return Promise.resolve(audioCtx);
        soundState = "loading"; renderPlayButton();
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.gain.value = 0.9;
          master.connect(audioCtx.destination);
          var map = new Map();
          var jobs = Object.keys(DRUM_SAMPLES_B64).map(function (note) {
            var b64 = DRUM_SAMPLES_B64[note];
            var bin = atob(b64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return audioCtx.decodeAudioData(bytes.buffer).then(function (buf) { map.set(Number(note), buf); });
          });
          return Promise.all(jobs).then(function () {
            buffers = map;
            noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
            var nd = noiseBuffer.getChannelData(0);
            for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
            soundState = "ready"; renderPlayButton();
            return audioCtx;
          }).catch(function () { soundState = "error"; renderPlayButton(); return null; });
        } catch (e) { soundState = "error"; renderPlayButton(); return Promise.resolve(null); }
      }
      function playSynthHit(kind, when, gain) {
        if (!master || !audioCtx) return;
        var out = audioCtx.createGain(); out.connect(master);
        if (kind === "low") {
          var osc = audioCtx.createOscillator(), og = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(150, when);
          osc.frequency.exponentialRampToValueAtTime(45, when + 0.12);
          og.gain.setValueAtTime(gain, when);
          og.gain.exponentialRampToValueAtTime(0.001, when + 0.28);
          osc.connect(og); og.connect(out);
          osc.start(when); osc.stop(when + 0.3);
        } else {
          var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
          var filter = audioCtx.createBiquadFilter(), fg = audioCtx.createGain();
          var dur = kind === "metal" ? 0.09 : 0.18;
          filter.type = kind === "metal" ? "highpass" : "bandpass";
          filter.frequency.value = kind === "metal" ? 7500 : 1800;
          fg.gain.setValueAtTime(gain, when);
          fg.gain.exponentialRampToValueAtTime(0.001, when + dur);
          src.connect(filter); filter.connect(fg); fg.connect(out);
          src.start(when); src.stop(when + dur + 0.02);
          if (kind === "snap") {
            var o2 = audioCtx.createOscillator(), og2 = audioCtx.createGain();
            o2.type = "triangle"; o2.frequency.value = 190;
            og2.gain.setValueAtTime(gain * 0.6, when);
            og2.gain.exponentialRampToValueAtTime(0.001, when + 0.11);
            o2.connect(og2); og2.connect(out);
            o2.start(when); o2.stop(when + 0.12);
          }
        }
      }
      function playRowHit(rowLabel, fillValue, when) {
        if (!audioCtx || !master) return;
        var gain = FILL_GAIN[fillValue] || 1;
        var note = gmNoteForRow(rowLabel);
        var buf = note !== null && buffers ? buffers.get(note) : undefined;
        if (buf) {
          var src = audioCtx.createBufferSource(); src.buffer = buf;
          var g = audioCtx.createGain(); g.gain.value = gain;
          src.connect(g); g.connect(master);
          src.start(when);
        } else {
          playSynthHit(synthKindForRow(rowLabel), when, gain);
        }
      }
      function renderPlayButton() {
        playBtn.textContent = soundState === "loading" ? "Loading sounds…" : isPlaying ? "■ Stop" : "▶ Play";
        playBtn.setAttribute("aria-label", isPlaying ? "Stop playback" : "Play pattern");
        playBtn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
        playBtn.classList.toggle("playing", isPlaying);
      }
      function stopPlayback() {
        runId++; playingFlag = false;
        if (playTimer) clearInterval(playTimer); playTimer = null;
        uiTimers.forEach(clearTimeout); uiTimers = [];
        isPlaying = false; playColumn = null;
        renderPlayButton(); renderPlayhead();
      }
      function startPlayback() {
        ensureAudio().then(function (ctx) {
          if (!ctx) return;
          ctx.resume();
          stopPlayback();
          var myRun = runId;
          playingFlag = true; isPlaying = true; renderPlayButton();
          var col = 0, nextTime = ctx.currentTime + 0.08;
          function tick() {
            if (!playingFlag || myRun !== runId) return;
            var cols = pattern.columns.length;
            if (cols === 0) return;
            var stepDur = 60 / tempo / Math.max(1, pattern.subdivision);
            while (nextTime < ctx.currentTime + 0.12) {
              var c = ((col % cols) + cols) % cols;
              for (var r = 0; r < pattern.rows.length; r++) {
                var v = (pattern.cells[r] && pattern.cells[r][c]) || 0;
                if (v !== 0) playRowHit(pattern.rows[r] || "", v, nextTime);
              }
              (function (scheduledCol, delay) {
                uiTimers.push(setTimeout(function () {
                  if (playingFlag && myRun === runId) { playColumn = scheduledCol; renderPlayhead(); }
                }, delay));
              })(c, Math.max(0, (nextTime - ctx.currentTime) * 1000));
              col++; nextTime += stepDur;
            }
          }
          tick();
          playTimer = setInterval(tick, 25);
        });
      }
      playBtn.addEventListener("click", function () { if (isPlaying) stopPlayback(); else startPlayback(); });

      /* ── About popup ── */
      var aboutBtn = document.getElementById("aboutBtn");
      function closeAbout() { var m = document.querySelector(".modal-backdrop"); if (m) m.remove(); }
      function downloadFile(name, text, type) {
        var blob = new Blob([text], { type: type || "text/plain" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
      function openAbout() {
        closeAbout();
        var backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";
        var modal = document.createElement("div");
        modal.className = "modal";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.setAttribute("aria-label", "About");
        modal.innerHTML =
          '<div class="modal-head"><h2>About</h2><button type="button" class="modal-close" aria-label="Close about">×</button></div>' +
          '<p>Pick a fill, then tap — or drag across — cells to paint. Tap a cell again with that same fill selected and it erases; pick a different fill and tap to overwrite what’s already there.</p>' +
          '<p>Hits stay on their beat when you change the subdivision — new columns open up between the beats instead of pushing your hits sideways. A hit only disappears if its exact spot doesn’t exist in the new division (like the “&amp;” going back to plain beats). You can still tap any column or row label to rename it.</p>' +
          '<p>Press Play and a playhead steps across the columns at your tempo, looping the measure. Each row plays its General MIDI drum voice — snare, bass drum, hi-hat, toms, cymbals — matched from the row’s name; rename a row and its sound follows. Solid hits play full, the patterned fills play softer, like ghost notes. A voice name with no GM match gets a simple synthesized hit.</p>' +
          '<p>Read the grid left to right: each column is a moment in the measure, each row is one part of the kit. The five fills — solid, lined, dotted, cross, and rings — can mark full hits, ghost notes, accents, or whatever they mean in your beat. Adding more beats or voices never scrolls the grid sideways: the whole table shrinks to stay on one screen.</p>' +
          '<p>This is the standalone build: one single HTML file with no server behind it. Your pattern saves in this browser’s local storage on this device. To publish it, put this file in a GitHub repository as <span class="mono">index.html</span> and enable GitHub Pages — or just open the file in any browser.</p>' +
          '<p class="small">Playback sounds: the Standard drum kit from TimGM6mb, a small complete General MIDI soundfont by Tim Brechbill and David Bolton, licensed under the GNU General Public License v2 — the same license that ships with the font in Debian/Ubuntu’s timgm6mb-soundfont package. Only the drum kit is embedded (about 66 KB of audio), to keep the app lightweight.</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="pill-btn" id="dlApp">Download this app (index.html)</button>' +
            '<button type="button" class="pill-btn" id="dlPattern">Export pattern (.json)</button>' +
            '<button type="button" class="pill-btn" id="impPattern">Import pattern</button>' +
          '</div>' +
          '<button type="button" class="done-btn">Done</button>';
        backdrop.appendChild(modal);
        shell.appendChild(backdrop);
        backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeAbout(); });
        modal.querySelector(".modal-close").addEventListener("click", closeAbout);
        modal.querySelector(".done-btn").addEventListener("click", closeAbout);
        modal.querySelector("#dlApp").addEventListener("click", function () {
          closeAbout();
          var html = "<!doctype html>\n" + document.documentElement.outerHTML;
          downloadFile("index.html", html, "text/html");
        });
        modal.querySelector("#dlPattern").addEventListener("click", function () {
          downloadFile((pattern.name || "pattern").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".json",
            JSON.stringify(pattern, null, 2), "application/json");
        });
        modal.querySelector("#impPattern").addEventListener("click", function () {
          var fileInp = document.createElement("input");
          fileInp.type = "file"; fileInp.accept = ".json,application/json";
          fileInp.addEventListener("change", function () {
            var f = fileInp.files && fileInp.files[0];
            if (!f) return;
            var reader = new FileReader();
            reader.onload = function () {
              try {
                var p = JSON.parse(String(reader.result || ""));
                if (!p || !Array.isArray(p.columns) || !Array.isArray(p.rows) || !Array.isArray(p.cells)) return;
                if (!(p.beats >= 1 && p.beats <= 12) || !(p.subdivision >= 1 && p.subdivision <= 4)) return;
                stopPlayback();
                pattern = p;
                nameEl.value = pattern.name || "";
                save(true); render();
                closeAbout();
              } catch (e) {}
            };
            reader.readAsText(f);
          });
          fileInp.click();
        });
      }
      aboutBtn.addEventListener("click", openAbout);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAbout(); });

      render();
      renderPlayButton();
    </script>
  </body>
</html>
