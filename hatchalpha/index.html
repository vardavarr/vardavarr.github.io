<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Tally Notation — the keyboard drawn as tallies. Tap tallies to circle the notes of a chord, hear it played on piano, and watch each note take its shape: circle, triangle, pentagon, diamond." />
    <link rel="icon" href="data:," />
    <title>Tally Notation — Standalone</title>
    <style>
      :root {
        /* Dark mode only: near-black background, light tallies, no
           matter what appearance the device is set to. */
        color-scheme: dark;
        --bg: #161311;
        --surface: #211d19;
        --surface2: #2c2721;
        --text: #f3ede2;
        --dim: #a39a8c;
        --border: #453d33;
        --accent-strong: #ea580c;
        --teal: #2dd4bf;
        /* Pre-identification circles share the extension diamonds'
           violet exactly: un-named notes are "extra" notes, like
           extensions — they don't decide major/minor quality. */
        --circle: #ab47bc;
        /* Role colours once a chord is named — four separate hue
           families (true red, azure, teal-green, violet), each holding
           strong contrast against both the background and the tallies.
           Roles are also told by SHAPE, never colour alone. */
        --role-root: #e53935;
        --role-third: #2275b5;
        --role-fifth: #0ca678;
        --role-other: #ab47bc;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      button { font-family: inherit; color: inherit; }
      .serif { font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

      /* ── Shell: pre-rotated on portrait phones, upright elsewhere ── */
      #shell { position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
      #shell.rotated { left: 100dvw; width: 100dvh; height: 100dvw; transform: rotate(90deg); transform-origin: top left; }

      .stage { display: flex; flex-direction: column; height: 100%; padding: 8px 12px; }
      @media (min-width: 640px) { .stage { padding: 8px 20px 12px; } }

      /* ── Readout: chord name + note names ── */
      .readout-name {
        margin: 0; font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 30px;
      }
      @media (min-width: 640px) { .readout-name { font-size: 30px; min-height: 38px; } }
      .readout-notes {
        margin: 0; height: 20px; line-height: 20px; font-size: 14px; font-weight: 500; color: var(--dim);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ── The staff ── */
      .staff { position: relative; flex: 1; min-height: 0; margin-top: 4px; container-type: size; }
      .tally-btn {
        position: absolute; transform: translateX(-50%); height: 42%; padding: 0;
        background: none; border: 0; cursor: pointer; touch-action: manipulation;
      }
      .tally-stroke {
        position: absolute; left: 50%; top: 50%; height: 86%; width: 6px;
        transform: translate(-50%, -50%); border-radius: 999px; background: var(--text);
        opacity: 0.8; transition: opacity 120ms ease;
      }
      .tally-btn:active .tally-stroke { opacity: 1; }
      .tally-btn[aria-pressed="true"] .tally-stroke { opacity: 1; }
      .mark {
        position: absolute; left: 50%; top: 50%; display: block; aspect-ratio: 1;
        transform: translate(-50%, -50%); pointer-events: none;
      }
      .mark svg { display: block; width: 100%; height: 100%; }
      .mark-hollow {
        border-radius: 999px; border: 7px solid var(--circle);
      }
      .c-label {
        position: absolute; transform: translateX(-50%); top: 91.5%;
        font-weight: 700; line-height: 1; color: var(--dim); pointer-events: none;
      }

      /* Mark pop + ringing glow (glow follows the shape's outline via
         drop-shadow, in the mark's own colour). */
      @keyframes tally-pop {
        0% { transform: translate(-50%, -50%) scale(0.55); opacity: 0; }
        60% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      @keyframes tally-ring {
        0% { filter: drop-shadow(0 0 10px var(--tally-accent, var(--circle))); }
        100% { filter: drop-shadow(0 0 16px transparent); }
      }
      .tally-circle, .tally-mark { animation: tally-pop 160ms ease-out; }
      .tally-ringing { animation: tally-pop 160ms ease-out, tally-ring 700ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .tally-circle, .tally-mark, .tally-ringing { animation: none; }
      }

      /* ── Control strip ── */
      .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; flex-shrink: 0; }
      .play-btn {
        border: 0; border-radius: 999px; padding: 8px 16px;
        font-size: 14px; font-weight: 700; color: #fff; background: var(--teal); cursor: pointer;
      }
      .play-btn:disabled { opacity: 0.4; cursor: default; }
      .pill-btn {
        border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
        padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
      }
      .pill-btn:disabled { opacity: 0.4; cursor: default; }
      #aboutBtn { margin-left: auto; flex-shrink: 0; }
      .sound-error { font-size: 12px; font-weight: 500; color: var(--accent-strong); }

      /* ── About popup ── */
      .modal-backdrop {
        position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.5); padding: 16px;
      }
      .modal {
        width: 100%; max-width: 512px; max-height: 100%; overflow-y: auto;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      }
      @media (min-width: 640px) { .modal { padding: 20px; } }
      .modal h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
      .modal h3 { margin: 16px 0 0; font-size: 14px; font-weight: 700; }
      .modal p { margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--dim); }
      .modal p.small, .modal li.small { font-size: 12px; }
      .modal ol { margin: 8px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.6; color: var(--dim); }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .modal-close {
        flex-shrink: 0; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface2); font-size: 16px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .modal-actions .pill-btn { flex: 1; white-space: nowrap; text-align: center; padding: 8px 12px; font-size: 13px; }
      .done-btn { width: 100%; margin-top: 10px; border: 0; border-radius: 999px; background: var(--teal); color: #fff; padding: 9px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <noscript><p style="padding:16px">Tally Notation needs JavaScript to run.</p></noscript>
    <div id="shell">
      <section class="stage" aria-label="Tally notation stage">
        <div>
          <p class="readout-name serif" id="chordName" aria-live="polite">&nbsp;</p>
          <p class="readout-notes" id="noteList">&nbsp;</p>
        </div>

        <div class="staff" id="staff" role="group"
             aria-label="Tallies from F 3 to B 5: two octaves plus the group of three below. Bottom row: white keys. Top row: black keys."></div>

        <div class="strip">
          <button type="button" id="playBtn" class="play-btn" aria-label="Play the circled chord">▶ Play chord</button>
          <button type="button" id="clearBtn" class="pill-btn" aria-label="Clear all circles">Clear</button>
          <span class="sound-error" id="soundError" hidden>Sounds couldn’t load — the tallies still work.</span>
          <button type="button" id="aboutBtn" class="pill-btn" aria-label="About tally notation">About</button>
        </div>
      </section>
    </div>

        if (!pcs[(root + 7) % 12] && (interval === 6 || interval === 8)) return "fifth";
        return "other";
      }

      /* Solid shape per role — role is never told by colour alone
         (WCAG 1.4.1). Overshoot: the triangle ~13%, the pentagon and
         diamond ~17%, so all four marks read as the same size. */
      var ROLE_MARK = {
        root:  { shape: "circle",   color: "var(--role-root)",  hex: "#E53935", width: "min(50px, 90%)",  shapeName: "circle" },
        third: { shape: "triangle", color: "var(--role-third)", hex: "#2275B5", width: "min(56px, 102%)", shapeName: "triangle" },
        fifth: { shape: "pentagon", color: "var(--role-fifth)", hex: "#0CA678", width: "min(58px, 106%)", shapeName: "pentagon" },
        other: { shape: "diamond",  color: "var(--role-other)", hex: "#AB47BC", width: "min(58px, 106%)", shapeName: "diamond" }
      };
      var MARK_POINTS = {
        triangle: "50,7 95,90 5,90",
        pentagon: "50,3 97,37 79,93 21,93 3,37",
        diamond: "50,3 97,50 50,97 3,50"
      };

      /* ── State: circled notes, saved to local storage ───────────── */
      var notes = (function () {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          var seen = {}, out = [];
          arr.forEach(function (n) {
            if (typeof n === "number" && n >= 53 && n <= 83 && !seen[n]) { seen[n] = true; out.push(n); }
          });
          return out.sort(function (a, b) { return a - b; });
        } catch (e) { return []; }
      })();
      var ringing = {};
      var soundState = "idle"; /* idle | loading | ready | error */

      var shell = document.getElementById("shell");
      var staffEl = document.getElementById("staff");
      var chordNameEl = document.getElementById("chordName");
      var noteListEl = document.getElementById("noteList");
      var playBtn = document.getElementById("playBtn");
      var clearBtn = document.getElementById("clearBtn");
      var aboutBtn = document.getElementById("aboutBtn");
      var soundErrorEl = document.getElementById("soundError");

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch (e) {}
      }

      /* ── Rendering ──────────────────────────────────────────────── */
      var tallyButtons = {};
      function buildStaff() {
        staffEl.innerHTML = "";
        tallyButtons = {};
        TALLIES.forEach(function (t) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tally-btn";
          btn.style.left = (t.x / WHITE_COUNT) * 100 + "%";
          btn.style.top = t.black ? "2%" : "52%";
          btn.style.width = "min(64px, " + (0.92 / WHITE_COUNT) * 100 + "%)";
          btn.setAttribute("data-midi", String(t.midi));
          var stroke = document.createElement("span");
          stroke.className = "tally-stroke";
          stroke.setAttribute("aria-hidden", "true");
          btn.appendChild(stroke);
          btn.addEventListener("click", function () { toggle(t.midi); });
          staffEl.appendChild(btn);
          tallyButtons[t.midi] = btn;
        });
        TALLIES.forEach(function (t) {
          if (t.black || t.midi % 12 !== 0) return;
          var c = document.createElement("span");
          c.className = "c-label serif";
          c.setAttribute("aria-hidden", "true");
          c.style.left = (t.x / WHITE_COUNT) * 100 + "%";
          c.style.fontSize = "8.5cqh";
          c.textContent = "C";
          staffEl.appendChild(c);
        });
      }

      function markHTML(mark, isRinging) {
        var inner;
        if (mark.shape === "circle") {
          inner = '<circle cx="50" cy="50" r="47" fill="' + mark.hex + '"/>';
        } else {
          inner = '<polygon points="' + MARK_POINTS[mark.shape] + '" fill="' + mark.hex + '"/>';
        }
        return '<svg viewBox="0 0 100 100" aria-hidden="true">' + inner + "</svg>";
      }

      function render() {
        var selected = {};
        notes.forEach(function (n) { selected[n] = true; });
        var identified = identifyChord(notes);
        var named = identified ? identified.name : null;
        var pcs = {};
        notes.forEach(function (n) { pcs[n % 12] = true; });
        var noteList = notes.map(function (n) { return PITCH_NAMES[n % 12] || ""; })
          .filter(Boolean).join(" · ");

        /* Header: totally blank (space held) when nothing is circled,
           so the staff never resizes. */
        chordNameEl.innerHTML = notes.length === 0 ? "&nbsp;" : escapeHTML(named !== null ? named : noteList);
        noteListEl.innerHTML = (notes.length > 0 && named) ? escapeHTML(noteList) : "&nbsp;";

        TALLIES.forEach(function (t) {
          var btn = tallyButtons[t.midi];
          if (!btn) return;
          var isOn = !!selected[t.midi];
          var old = btn.querySelector(".mark");
          if (old) old.remove();
          var role = (isOn && identified) ? chordRole(t.midi, identified.root, pcs) : null;
          var mark = role ? ROLE_MARK[role] : null;
          btn.setAttribute("aria-pressed", isOn ? "true" : "false");
          btn.setAttribute("aria-label",
            t.name + (t.black ? ", black key" : "") + ": " + (isOn ? "circled" : "not circled") +
            (role && mark ? ", the " + role + " of the chord, marked with a solid " + mark.shapeName : "") +
            ". Tap to " + (isOn ? "remove the circle" : "circle it") + ".");
          if (!isOn) return;
          var span = document.createElement("span");
          span.setAttribute("aria-hidden", "true");
          var isRinging = !!ringing[t.midi];
          if (mark) {
            span.className = "mark " + (isRinging ? "tally-ringing" : "tally-mark");
            span.style.width = mark.width;
            span.style.setProperty("--tally-accent", mark.color);
            span.innerHTML = markHTML(mark, isRinging);
          } else {
            /* Before a chord is named: a hollow violet circle with a
               thick ring (weight grows inward), the same size as the
               solid root circle it may become. */
            span.className = "mark mark-hollow " + (isRinging ? "tally-ringing" : "tally-circle");
            span.style.width = "min(50px, 90%)";
            span.style.setProperty("--tally-accent", "var(--circle)");
          }
          btn.appendChild(span);
        });

        playBtn.disabled = notes.length === 0 || soundState === "loading";
        playBtn.textContent = soundState === "loading" ? "Loading sounds…" : "▶ Play chord";
        clearBtn.disabled = notes.length === 0;
        soundErrorEl.hidden = soundState !== "error";
      }

      function escapeHTML(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function toggle(midi) {
        var idx = notes.indexOf(midi);
        if (idx >= 0) {
          notes.splice(idx, 1);
        } else {
          notes.push(midi);
          notes.sort(function (a, b) { return a - b; });
          save();
          render();
          playNotes([midi]);
          return;
        }
        save();
        render();
      }

      /* ── Playback ───────────────────────────────────────────────────
         Acoustic Grand Piano from TimGM6mb.sf2 (GPL-2), decoded once
         on the first tap that needs sound — also the user gesture
         browsers require before audio. */
      var audioCtx = null, buffers = null, ringTimers = [];
      function ensureAudio() {
        if (audioCtx && buffers) return Promise.resolve(audioCtx);
        soundState = "loading"; render();
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          soundState = "error"; render();
          return Promise.resolve(null);
        }
        var ctx = audioCtx;
        var map = {};
        var jobs = Object.keys(PIANO_SAMPLES_B64).map(function (k) {
          var b64 = PIANO_SAMPLES_B64[k];
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return ctx.decodeAudioData(bytes.buffer).then(function (buf) { map[Number(k)] = buf; });
        });
        return Promise.all(jobs).then(function () {
          buffers = map;
          soundState = "ready"; render();
          return ctx;
        }).catch(function () {
          soundState = "error"; render();
          return null;
        });
      }

      /* Every note rings for exactly the same length of time: one
         shared envelope — full level held to 55% of a fixed 1.8 s
         ring, then one smooth fade, every source stopping at the
         same instant — so low notes don't out-ring high ones. */
      function playNotes(list) {
        if (!list.length) return;
        ensureAudio().then(function (ctx) {
          if (!ctx || !buffers) return;
          return ctx.resume().then(function () {
            var startAt = ctx.currentTime + 0.06;
            var gainValue = Math.min(0.9, 2.2 / Math.sqrt(list.length + 1));
            var RING_SECONDS = 1.8;
            var fadeStart = startAt + RING_SECONDS * 0.55;
            var fadeEnd = startAt + RING_SECONDS;
            list.forEach(function (midi) {
              var buf = buffers[midi];
              if (!buf) return;
              var src = ctx.createBufferSource();
              src.buffer = buf;
              var g = ctx.createGain();
              g.gain.setValueAtTime(gainValue, startAt);
              g.gain.setValueAtTime(gainValue, fadeStart);
              g.gain.exponentialRampToValueAtTime(0.0001, fadeEnd);
              src.connect(g); g.connect(ctx.destination);
              src.start(startAt);
              src.stop(fadeEnd + 0.05);
            });
            ringing = {};
            list.forEach(function (m) { ringing[m] = true; });
            render();
            ringTimers.push(setTimeout(function () { ringing = {}; render(); }, 750));
          });
        });
      }

      playBtn.addEventListener("click", function () { playNotes(notes.slice()); });
      clearBtn.addEventListener("click", function () { notes = []; save(); render(); });

      /* ── Orientation: pre-rotated landscape on portrait phones ──── */
      function computeShouldRotate() {
        var portrait = window.innerHeight > window.innerWidth;
        if (!portrait) return false;
        var shortSide = Math.min(window.innerWidth, window.innerHeight);
        if (shortSide > 600) return false;
        var coarse = typeof window.matchMedia === "function" && window.matchMedia("(pointer: coarse)").matches;
        var mobileUa = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent || "");
        return coarse || mobileUa;
      }
      function applyRotation() {
        shell.classList.toggle("rotated", computeShouldRotate());
        shell.setAttribute("data-layout", computeShouldRotate() ? "phone-rotated" : "upright");
      }
      window.addEventListener("resize", applyRotation);
      window.addEventListener("orientationchange", applyRotation);

      /* ── About popup ────────────────────────────────────────────── */
      function closeAbout() { var m = document.querySelector(".modal-backdrop"); if (m) m.remove(); }
      function downloadFile(name, text, type) {
        var blob = new Blob([text], { type: type || "text/plain" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
      function openAbout() {
        closeAbout();
        var backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";
        var modal = document.createElement("div");
        modal.className = "modal";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.setAttribute("aria-label", "About tally notation");
        modal.innerHTML =
          '<div class="modal-head"><h2 class="serif">About tally notation</h2><button type="button" class="modal-close" aria-label="Close about">×</button></div>' +
          '<p>The keyboard, drawn as tallies. The bottom row is the white keys — evenly spaced, one tally per key. The top row is the black keys, sitting between the white tallies in their groups of two and three. Every tally is exactly the same length and the same width.</p>' +
          '<p>Tap a tally to draw a circle in its middle: that note is in the chord, and you hear it as you tap. Tap it again to take the circle away. Circle a few tallies and press Play chord to hear them together. Two octaves — C to B, twice — plus the group of three below them, down to F, so flat and sharp roots still have room for big seventh and extended chords. Your circles are saved as you tap, in this browser.</p>' +
          '<p>Once the circled notes add up to a chord the app can name — sevenths, ninths, elevenths, thirteenths and altered extensions included — each mark becomes a solid shape for its job in the chord, wherever it sits, not just in root position: the root is a true red circle, the third an azure triangle, the fifth a teal-green pentagon, and sevenths, extensions and every other note are violet diamonds. The four colours live in completely separate families — red, blue, green and violet — so no role can be mistaken for a different shade of another. The shapes count, too: three sides for the third, five sides for the fifth. The triangle, pentagon and diamond are drawn a little larger (overshoot — the pointed shapes a touch more, the triangle a touch less), so all four shapes look the same size to the eye.</p>' +
          '<p>The shapes are there for accessibility: a chord role is never told by colour alone (WCAG 1.4.1), so the marks still read in greyscale and to colour-blind eyes, and the colours themselves are chosen for maximum contrast against both the background and the tallies, following the WCAG guidelines. Until a chord is named, marks stay thick-ringed violet circles — the same violet as the extension diamonds, because notes that haven’t made a chord yet are extras in the same way extensions are: they colour the sound without deciding whether the chord is major or minor. And when a chord plays, every note rings for exactly the same length of time — one shared fade, so the low notes don’t out-ring the high ones.</p>' +
          '<p>Tally notation is for chords, the way graph notation is for beats: no note names to learn first — find the pattern of tallies, circle the pattern, play the pattern.</p>' +
          '<h3>Putting this app on GitHub Pages</h3>' +
          '<p>This is the standalone build: one single HTML file with no server behind it. Your circled notes save in this browser’s local storage on this device. To publish it:</p>' +
          '<ol><li>Download this app (button below) — or copy this page’s <span class="mono">index.html</span> — into a GitHub repository.</li><li>In the repository, open <strong>Settings → Pages</strong> and choose “Deploy from a branch”, picking your main branch and the root folder.</li><li>GitHub gives you a URL like <span class="mono">https://&lt;you&gt;.github.io/&lt;repo&gt;/</span> — open it on any phone or computer and the app runs as-is. No build step, no dependencies.</li></ol>' +
          '<p>You can also move a chord between devices: Export writes the circled notes as a small JSON file; Import reads it back in.</p>' +
          '<p class="small">Playback sounds: the Acoustic Grand Piano from TimGM6mb, a small complete General MIDI soundfont by Tim Brechbill and David Bolton, licensed under the GNU General Public License v2 — the same license that ships with the font in Debian/Ubuntu’s timgm6mb-soundfont package. Only the piano is bundled (about 304 KB of audio), to keep the app lightweight.</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="pill-btn" id="dlApp">Download this app (index.html)</button>' +
            '<button type="button" class="pill-btn" id="dlNotes">Export chord (.json)</button>' +
            '<button type="button" class="pill-btn" id="impNotes">Import chord</button>' +
          '</div>' +
          '<button type="button" class="done-btn">Done</button>';
        backdrop.appendChild(modal);
        shell.appendChild(backdrop);
        backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeAbout(); });
        modal.querySelector(".modal-close").addEventListener("click", closeAbout);
        modal.querySelector(".done-btn").addEventListener("click", closeAbout);
        modal.querySelector("#dlApp").addEventListener("click", function () {
          closeAbout();
          downloadFile("index.html", "<!doctype html>\n" + document.documentElement.outerHTML, "text/html");
        });
        modal.querySelector("#dlNotes").addEventListener("click", function () {
          var identified = identifyChord(notes);
          downloadFile("tally-chord.json", JSON.stringify({
            app: "tally-notation", version: 1, chord: identified ? identified.name : null, notes: notes
          }, null, 2), "application/json");
        });
        modal.querySelector("#impNotes").addEventListener("click", function () {
          var fileInp = document.createElement("input");
          fileInp.type = "file"; fileInp.accept = ".json,application/json";
          fileInp.addEventListener("change", function () {
            var f = fileInp.files && fileInp.files[0];
            if (!f) return;
            var reader = new FileReader();
            reader.onload = function () {
              try {
                var p = JSON.parse(String(reader.result || ""));
                var arr = Array.isArray(p) ? p : p.notes;
                if (!Array.isArray(arr)) return;
                var seen = {}, out = [];
                arr.forEach(function (n) {
                  if (typeof n === "number" && n >= 53 && n <= 83 && !seen[n]) { seen[n] = true; out.push(n); }
                });
                notes = out.sort(function (a, b) { return a - b; });
                save(); render(); closeAbout();
              } catch (e) {}
            };
            reader.readAsText(f);
          });
          fileInp.click();
        });
      }
      aboutBtn.addEventListener("click", openAbout);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAbout(); });

      /* ── Go ─────────────────────────────────────────────────────── */
      applyRotation();
      buildStaff();
      render();
    </script>
  </body>
</html>
